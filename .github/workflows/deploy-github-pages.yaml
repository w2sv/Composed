name: Deploy GitHub Pages

on:
    push:
        branches:
            - main

env:
    JAVA_VERSION: 17

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v7

            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Build site
              run: |
                  ./gradlew dokkaGeneratePublicationHtml :playground:wasmJsBrowserDistribution

                  mkdir -p build/pages
                  cp -R build/dokka/html/. build/pages/

                  mkdir -p build/pages/playground
                  cp -R playground/build/dist/wasmJs/productionExecutable/. build/pages/playground/

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: build/pages

            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v5
