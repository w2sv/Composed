name: Build
on: [ push, pull_request ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup JDK
                uses: actions/setup-java@v5
                with:
                    java-version: 17.0.20+101
                    distribution: temurin

            -   name: Build
                run: ./gradlew build
