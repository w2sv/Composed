[versions]
android-gradle-plugin = "9.3.1"
androidx-activity-compose = "1.13.0"
androidx-annotation = "1.10.0"
androidx-core-ktx = "1.19.0"
jetbrains-androidx-lifecycle = "2.11.0"
jetbrains-compose = "1.11.1"
jetbrains-compose-material3 = "1.9.0"
# @pin
# contains expressive while being based on jetbrains-compose 1.11.1
jetbrains-compose-material3-expressive = "1.11.0-alpha07"
jetbrains-dokka = "2.2.0"
jetbrains-kotlinx-kover = "0.9.9"
jlleitschuh-gradle-ktlint = "14.2.0"
junit = "4.13.2"
# @pin
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
# @pin
ktlint = "1.8.0"
littlerobots-versionCatalogUpdate = "1.1.1"
oikvpqya-compose-fastscroller = "0.3.2"
robolectric = "4.16.1"
vanniktech-maven-publish = "0.37.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
jetbrains-androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-androidx-lifecycle" }
jetbrains-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "jetbrains-compose" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrains-compose" }
jetbrains-compose-material-icons-extended = "org.jetbrains.compose.material:material-icons-extended:1.7.3"
#noinspection SimilarGradleDependency
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrains-compose-material3" }
#noinspection SimilarGradleDependency
jetbrains-compose-material3-expressive = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrains-compose-material3-expressive" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrains-compose" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetbrains-compose" }
jetbrains-compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "jetbrains-compose" }
jetbrains-compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "jetbrains-compose" }
oikvpqya-compose-fastscroller-core = { module = "io.github.oikvpqya.compose.fastscroller:fastscroller-core", version.ref = "oikvpqya-compose-fastscroller" }
jetbrains-kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
jetbrains-kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
roboelectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "jetbrains-dokka" }
jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "jetbrains-kotlinx-kover" }
jlleitschuh-gradle-ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "jlleitschuh-gradle-ktlint" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "littlerobots-versionCatalogUpdate" }
